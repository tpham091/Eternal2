{% assign business = site.data.site %}
{% assign artist = site.data.artists | where: "slug", page.slug | first %}
<!-- Structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "@id": "{{ page.url | absolute_url }}#profile",
  "url": "{{ page.url | absolute_url }}",
  "name": {{ artist.name | append: " — Eternal Courage Tattoo" | jsonify }},
  "description": {{ artist.bio | jsonify }},
  "isPartOf": { "@id": "{{ "/" | absolute_url }}#business" },
  "mainEntity": {
    "@type": "Person",
    "@id": "{{ page.url | absolute_url }}#person",
    "name": {{ artist.name | jsonify }},
    "jobTitle": "Tattoo Artist",
    "image": "{{ artist.image | absolute_url }}",
    "sameAs": "{{ artist.instagram }}",
    "worksFor": {
      "@type": "TattooParlor",
      "@id": "{{ "/" | absolute_url }}#business",
      "name": "{{ business.brand | escape }}",
      "url": "{{ "/" | absolute_url }}"
    },
    "knowsAbout": {{ artist.tags | jsonify }}
  }
}
</script>
